name: artifact-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"

      - name: Compile Python sources
        run: python -m compileall -q experiments reproduce.py

      - name: Install CPU-only PyTorch
        run: >-
          python -m pip install "torch==2.10.0"
          --index-url https://download.pytorch.org/whl/cpu

      - name: Install recorded dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Validate cached artifact
        run: python reproduce.py --check

      - name: Exercise cached redraw workflow
        run: python reproduce.py --fast
